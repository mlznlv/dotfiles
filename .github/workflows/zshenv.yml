name: zshenv

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      XDG_CONFIG_HOME: /tmp/zshenv-test/.config

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh python3-yaml

      - name: Prepare isolated config
        run: |
          mkdir -p "$XDG_CONFIG_HOME/zsh/custom"
          cp dot_config/zsh/*.zsh "$XDG_CONFIG_HOME/zsh/"
          cp config/shell.default.yaml "$XDG_CONFIG_HOME/zsh/shell.yaml"

      - name: Check defaults
        run: python3 ./zshenv check

      - name: Check extend and disable
        run: |
          custom="$XDG_CONFIG_HOME/zsh/custom/aliases.zsh"
          printf "alias ci-test='ok'\n" > "$custom"
          cat > "$XDG_CONFIG_HOME/zsh/shell.yaml" <<YAML
          version: 1
          shell:
            aliases:
              extend:
                path: $custom
            remote: false
            prompt: false
          YAML
          python3 ./zshenv check
          python3 ./zshenv diff
          python3 ./zshenv apply
          test -f "$XDG_CONFIG_HOME/zsh/generated/15-aliases.zsh"
          test ! -e "$XDG_CONFIG_HOME/zsh/generated/14-remote.zsh"
          test ! -e "$XDG_CONFIG_HOME/zsh/generated/16-prompt.zsh"

      - name: Reject invalid configuration without replacing generated state
        run: |
          before="$(find "$XDG_CONFIG_HOME/zsh/generated" -type f -print -exec sha256sum {} \; | sha256sum)"
          printf 'version: 1\nshell:\n  aliases:\n    path: relative.zsh\n' > "$XDG_CONFIG_HOME/zsh/shell.yaml"
          if python3 ./zshenv apply; then
            echo 'invalid configuration unexpectedly succeeded' >&2
            exit 1
          fi
          after="$(find "$XDG_CONFIG_HOME/zsh/generated" -type f -print -exec sha256sum {} \; | sha256sum)"
          test "$before" = "$after"
