name: Documentation

on:
  pull_request:
    branches:
      - master
      - next
  push:
    branches:
      - master
      - next

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: |
            **/*.md

      - name: Check links
        uses: lycheeverse/lychee-action@7da8ec1fc4e01b5a12062ac6c589c10a4ce70d67 # v2.0.0
        with:
          args: --verbose --no-progress --max-retries 3 './**/*.md'
          fail: true

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check required public files
        shell: bash
        run: |
          required_files=(
            README.md
            LICENSE
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            docs/architecture.md
            docs/roadmap.md
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "Missing required file: ${file}" >&2
              exit 1
            fi
          done

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
